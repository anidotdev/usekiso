    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('kisokata:theme')
          if (theme === 'light') {
            document.documentElement.dataset.theme = 'light'
            document.documentElement.style.colorScheme = 'light'
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f5f4ef')
          }
        } catch {}
      })()
    </script>
